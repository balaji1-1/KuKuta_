services:
  - type: web
    name: kukuta-backend
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      cd kukuta.com &&
      npm install &&
      npm run build &&
      cd .. &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn Kukuta.wsgi:application --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY --threads $GUNICORN_THREADS --timeout 30 --graceful-timeout 30 --worker-tmp-dir /dev/shm
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: API_REQUEST_MINUTE_LIMIT
        value: "10000"
      - key: DJANGO_USER_THROTTLE_RATE
        value: "1000/minute"
      - key: DJANGO_ANON_THROTTLE_RATE
        value: "100/minute"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: DJANGO_SECURE_COOKIE
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "kukuta-backend.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@kukuta.com"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: REDIS_URL
        sync: false
